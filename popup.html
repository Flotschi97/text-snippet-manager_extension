<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Snippet Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Meine Vorlagen</h1>

        <button id="toggleInputBtn" class="toggle-btn">Neue Vorlage hinzufügen</button>
        <div id="inputSection" class="input-section hidden">
            <input type="text" id="snippetTitle" placeholder="Titel der Vorlage">
            <textarea id="snippetContent" placeholder="Text-Inhalt"></textarea>
            <input type="text" id="snippetCategory" placeholder="Kategorie...">
            <button id="addSnippetBtn">Vorlage hinzufügen</button>
        </div>

        <div class="filter-section">
            <label for="categoryFilter">Kategorie filtern:</label>
            <select id="categoryFilter">
                <option value="all">Alle</option>
            </select>
        </div>

        <div id="snippetList">
            </div>
    </div>
    <a href="https://buymeacoffee.com/flotschi_97" target="_blank" class="buymeacoffee-btn">
      <img src="https://cdn.buymeacoffee.com/buttons/v2/default-yellow.png" alt="Buy me a coffee">
    </a>
    <a href="https://preisvergleich-extension-privacy.netlify.app/" target="_blank" class="privacy-link">Datenschutz/Privacy</a>
    <script src="popup.js"></script>
</body>
<div id="notification" class="notification">Text wurde kopiert!</div>

    <div class="container">
</html>
