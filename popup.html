<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Snippet Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="app-header">
            <div>
                <p class="eyebrow">TEXT SNIPPET MANAGER</p>
                <h1>My templates</h1>
            </div>
            <span class="header-mark" aria-hidden="true">Aa</span>
        </header>

        <button id="toggleInputBtn" class="toggle-btn">Add new template</button>
        <div id="inputSection" class="input-section hidden">
            <input type="text" id="snippetTitle" placeholder="Title of the template...">
            <textarea id="snippetContent" placeholder="Text content..."></textarea>
            <input type="text" id="snippetCategory" placeholder="Category...">
            <button id="addSnippetBtn">Add template</button>
        </div>

        <div class="filter-section">
            <label for="categoryFilter">Filter category:</label>
            <select id="categoryFilter">
                <option value="all">All</option>
            </select>
        </div>

        <div id="snippetList">
        </div>

        <footer class="app-footer">
            <a href="https://buymeacoffee.com/flotschi_97" target="_blank" rel="noopener noreferrer" class="buymeacoffee-btn">
                <span aria-hidden="true">☕</span> Buy me a coffee
            </a>
            <a href="https://curionics.netlify.app/privacy-extensions.html" target="_blank" rel="noopener noreferrer" class="privacy-link">Datenschutz / Privacy</a>
        </footer>
    </div>
    <script src="popup.js"></script>
    <div id="notification" class="notification">Text has been copied!</div>
</body>
</html>
