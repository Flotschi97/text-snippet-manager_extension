<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Snippet Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>My templates</h1>

        <button id="toggleInputBtn" class="toggle-btn">Add new template</button>
        <div id="inputSection" class="input-section hidden">
            <input type="text" id="snippetTitle" placeholder="Title of the template...">
            <textarea id="snippetContent" placeholder="Text content..."></textarea>
            <input type="text" id="snippetCategory" placeholder="Category...">
            <button id="addSnippetBtn">Add template</button>
        </div>

        <div class="filter-section">
            <label for="categoryFilter">Filter category:</label>
            <select id="categoryFilter">
                <option value="all">All</option>
            </select>
        </div>

        <div id="snippetList">
            </div>
    </div>
    <a href="https://buymeacoffee.com/flotschi_97" target="_blank" class="buymeacoffee-btn">
      <img src="https://cdn.buymeacoffee.com/buttons/v2/default-yellow.png" alt="Buy me a coffee">
    </a>
    <a href="https://preisvergleich-extension-privacy.netlify.app/" target="_blank" class="privacy-link">Datenschutz/Privacy</a>
    <script src="popup.js"></script>
</body>
<div id="notification" class="notification">Text has been copied!</div>

</html>
